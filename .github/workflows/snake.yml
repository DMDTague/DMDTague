name: generate snake animation

on:
  schedule:
    - cron: "0 5 * * *"   # runs once a day at 5am UTC
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: DMDTague
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=39FF14,00FFFF,FF00FF&color_dots=0d1117,0e4429,006d32,26a641,39FF14

      - name: push snake svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
